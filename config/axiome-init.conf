# axiome-init service definitions (parsed by /bin/init at boot)
# Fields: command, depends (comma/space separated), restart, maxfail, log

[syslog]
command=/bin/syslogd
depends=
restart=always
maxfail=0
log=/var/log/syslog.log

# Interactive console (getty-style): a shell on the serial TTY. restart=always
# means exiting the shell respawns a fresh prompt, like a real getty/login.
[console]
command=/bin/sh
depends=
restart=always
maxfail=0

# guixd: the display server daemon. Spawned by init it inherits the SYSTEM
# role and is one of the only processes allowed to touch /Devices/dri0 and
# /Devices/input0 directly (basic users are gated by the kernel). It grabs
# the input immediately so the text console stops driving the framebuffer
# once the desktop is up. restart=always also gives a desktop "Exit" the
# semantics of restarting the session via init.
[guixd]
command=/bin/guixd
depends=syslog
restart=always
maxfail=0

