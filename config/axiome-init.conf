# axiome-init service definitions (parsed by /bin/init at boot)
# Fields: command, depends (comma/space separated), restart, maxfail, log

[syslog]
command=/bin/syslogd
depends=
restart=always
maxfail=0
log=/var/log/syslog.log

# Interactive console (getty-style): a shell on the serial TTY. restart=always
# means exiting the shell respawns a fresh prompt, like a real getty/login.
[console]
command=/bin/sh
depends=
restart=always
maxfail=0

# guixd: the legacy display server daemon (SHM seqlock protocol).
# Kept for backward compatibility; axdisplay-server is the new protocol server.
#[guixd]
#command=/bin/guixd
#depends=syslog
#restart=always
#maxfail=0

# axdisplay-server: the new display server. Owns DRM master on /dev/dri/card0
# and serves the axw protocol on /devices/axw0. Single session, GOP backend.
[axdisplay-server]
command=/bin/axdisplay-server
depends=syslog
restart=always
maxfail=0

