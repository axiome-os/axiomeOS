# axboot.cfg - UEFI loader configuration (lives at \axboot.cfg on the ESP).
#
# Every non-comment line below is forwarded to the kernel command line.
# Rebuild the boot partition with `make disk.img` after editing.

# debug=1 streams kernel log output (printk) to the framebuffer.
# debug=0 keeps the screen clean: logs go to the serial console and
# /var/log/kernel.log only.
debug=0

# splash=1 shows the axiomeOS logo + rounded progress bar while booting.
# splash=0 disables the graphical splash entirely.
splash=1
